<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IQ Spectrogram Analyzer</title>
    <meta name="description" content="Analyze IQ signal spectrograms from .cf32 complex float32 files with interactive visualization">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header class="app-header">
            <div class="header-left">
                <div class="logo">
                    <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
                        <rect width="28" height="28" rx="6" fill="url(#logoGrad)"/>
                        <path d="M6 20 L10 10 L14 16 L18 8 L22 14" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        <defs>
                            <linearGradient id="logoGrad" x1="0" y1="0" x2="28" y2="28">
                                <stop offset="0%" stop-color="#6366f1"/>
                                <stop offset="100%" stop-color="#8b5cf6"/>
                            </linearGradient>
                        </defs>
                    </svg>
                </div>
                <div class="header-title">
                    <h1>IQ Spectrogram Analyzer</h1>
                    <span class="header-subtitle">Complex Float32 (.cf32) Signal Analysis</span>
                </div>
            </div>
            <div class="header-right">
                <div class="file-info" id="fileInfo" style="display:none;">
                    <span class="file-name" id="fileName"></span>
                    <span class="file-size" id="fileSize"></span>
                </div>
                <button class="btn btn-ghost" id="btnNewFile" style="display:none;" title="Open new file">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                        <polyline points="14 2 14 8 20 8"/>
                        <line x1="12" y1="18" x2="12" y2="12"/>
                        <line x1="9" y1="15" x2="15" y2="15"/>
                    </svg>
                </button>
                <a href="https://github.com/Brauuwu/iq_capture" target="_blank" class="btn btn-ghost" title="View source on GitHub" style="color: inherit; text-decoration: none; display: flex; align-items: center; justify-content: center;">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                        <path fill-rule="evenodd" clip-rule="evenodd" d="M12 2C6.477 2 2 6.477 2 12c0 4.42 2.865 8.166 6.839 9.489.5.092.682-.217.682-.482 0-.237-.008-.866-.013-1.7-2.782.603-3.369-1.34-3.369-1.34-.454-1.156-1.11-1.463-1.11-1.463-.908-.62.069-.608.069-.608 1.003.07 1.531 1.03 1.531 1.03.892 1.529 2.341 1.087 2.91.831.092-.646.35-1.086.636-1.336-2.22-.253-4.555-1.11-4.555-4.943 0-1.091.39-1.984 1.029-2.683-.103-.253-.446-1.27.098-2.647 0 0 .84-.269 2.75 1.025A9.578 9.578 0 0112 6.836c.85.004 1.705.114 2.504.336 1.909-1.294 2.747-1.025 2.747-1.025.546 1.377.203 2.394.1 2.647.64.699 1.028 1.592 1.028 2.683 0 3.842-2.339 4.687-4.566 4.935.359.309.678.919.678 1.852 0 1.336-.012 2.415-.012 2.743 0 .267.18.578.688.48C19.138 20.161 22 16.416 22 12c0-5.523-4.477-10-10-10z" />
                    </svg>
                </a>
            </div>
        </header>

        <!-- drop zone moved to right panel -->

        <!-- Settings Modal -->
        <div class="modal-overlay" id="settingsModal" style="display:none;">
            <div class="modal">
                <div class="modal-header">
                    <h2>Analysis Configuration</h2>
                    <button class="btn btn-ghost modal-close" id="modalClose">&times;</button>
                </div>
                <div class="modal-body">
                    <div class="form-group">
                        <label for="sampleRate">Sample Rate (Hz)</label>
                        <div class="input-with-presets">
                            <input type="number" id="sampleRate" value="2400000" min="1" step="1">
                            <div class="presets">
                                <button class="preset-btn" data-value="1000000">1 MHz</button>
                                <button class="preset-btn" data-value="2000000">2 MHz</button>
                                <button class="preset-btn" data-value="2400000">2.4 MHz</button>
                                <button class="preset-btn" data-value="10000000">10 MHz</button>
                                <button class="preset-btn" data-value="20000000">20 MHz</button>
                            </div>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="centerFreq">Center Frequency (Hz) <span class="optional">optional</span></label>
                        <div class="input-with-presets">
                            <input type="number" id="centerFreq" value="0" min="0" step="1000">
                            <div class="presets">
                                <button class="preset-btn" data-value="433000000">433 MHz</button>
                                <button class="preset-btn" data-value="868000000">868 MHz</button>
                                <button class="preset-btn" data-value="915000000">915 MHz</button>
                                <button class="preset-btn" data-value="2400000000">2.4 GHz</button>
                            </div>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="fftSize">FFT Size</label>
                            <select id="fftSize">
                                <option value="256">256</option>
                                <option value="512">512</option>
                                <option value="1024" selected>1024</option>
                                <option value="2048">2048</option>
                                <option value="4096">4096</option>
                                <option value="8192">8192</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="windowFunc">Window Function</label>
                            <select id="windowFunc">
                                <option value="hann" selected>Hann</option>
                                <option value="hamming">Hamming</option>
                                <option value="blackman">Blackman</option>
                                <option value="blackmanharris">Blackman-Harris</option>
                                <option value="rectangular">Rectangular</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="overlap">Overlap <span class="optional" id="overlapValue">87.5%</span></label>
                        <input type="range" id="overlap" min="0" max="95" value="87.5" step="2.5" style="width:100%;">
                        <div class="presets">
                            <button class="preset-btn" data-value="50" data-target="overlap">50%</button>
                            <button class="preset-btn active" data-value="87.5" data-target="overlap">87.5%</button>
                            <button class="preset-btn" data-value="93.75" data-target="overlap">93.75%</button>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="colormap">Color Map</label>
                        <div class="colormap-options" id="colormapOptions">
                            <label class="colormap-option selected" data-value="viridis">
                                <div class="colormap-preview viridis"></div>
                                <span>Viridis</span>
                            </label>
                            <label class="colormap-option" data-value="inferno">
                                <div class="colormap-preview inferno"></div>
                                <span>Inferno</span>
                            </label>
                            <label class="colormap-option" data-value="plasma">
                                <div class="colormap-preview plasma"></div>
                                <span>Plasma</span>
                            </label>
                            <label class="colormap-option" data-value="jet">
                                <div class="colormap-preview jet"></div>
                                <span>Jet</span>
                            </label>
                            <label class="colormap-option" data-value="grayscale">
                                <div class="colormap-preview grayscale"></div>
                                <span>Grayscale</span>
                            </label>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-primary" id="btnAnalyze">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polygon points="5 3 19 12 5 21 5 3"/>
                        </svg>
                        Analyze
                    </button>
                </div>
            </div>
        </div>

        <!-- Main Layout Split -->
        <div class="main-layout" style="display: flex; flex: 1; overflow: hidden; height: calc(100vh - 53px);">
            <!-- Analysis View (Left) -->
            <div class="analysis-container" id="analysisContainer" style="flex: 1; border-right: 1px solid var(--border-subtle); display: flex; flex-direction: column; background: var(--bg-primary);">
                <div id="illustrationContainer" style="flex: 1; display: flex; align-items: center; justify-content: center; padding: 20px;">
                    <img src="illustration.jpg" alt="Signal Analysis Illustration" style="max-width: 100%; max-height: 100%; object-fit: contain; border-radius: var(--radius-lg); box-shadow: var(--shadow-lg);">
                </div>
                <div id="analysisUI" style="display: none; flex: 1; flex-direction: column;">
            <!-- Toolbar -->
            <div class="toolbar">
                <div class="toolbar-left">
                    <div class="view-tabs">
                        <button class="tab-btn active" data-view="spectrogram" id="tabSpectrogram">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <rect x="3" y="3" width="18" height="18" rx="2"/>
                                <line x1="3" y1="9" x2="21" y2="9"/>
                                <line x1="3" y1="15" x2="21" y2="15"/>
                                <line x1="9" y1="3" x2="9" y2="21"/>
                                <line x1="15" y1="3" x2="15" y2="21"/>
                            </svg>
                            Spectrogram
                        </button>
                        <button class="tab-btn" data-view="psd" id="tabPSD">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>
                            </svg>
                            PSD
                        </button>
                        <button class="tab-btn" data-view="timedomain" id="tabTimeDomain">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M2 12C2 12 5 4 8 4C11 4 13 20 16 20C19 20 22 12 22 12"/>
                            </svg>
                            Time Domain
                        </button>
                        <button class="tab-btn" data-view="constellation" id="tabConstellation">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <circle cx="12" cy="12" r="9"/>
                                <line x1="12" y1="3" x2="12" y2="21"/>
                                <line x1="3" y1="12" x2="21" y2="12"/>
                            </svg>
                            Constellation
                        </button>
                        <button class="tab-btn" data-view="chirp" id="tabChirp">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M2 20C5 20 5 4 8 4C11 4 11 20 14 20C17 20 17 4 20 4L22 4"/>
                            </svg>
                            Chirp Analysis
                        </button>
                    </div>
                    <div class="zoom-controls" id="zoomControls">
                        <button class="btn btn-ghost btn-sm" id="btnPlayback" title="Play/Pause Waterfall">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon-play">
                                <polygon points="5 3 19 12 5 21 5 3"></polygon>
                            </svg>
                        </button>
                        <div class="toolbar-divider"></div>
                        <button class="btn btn-ghost btn-sm" id="btnZoomIn" title="Zoom In">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
                                <line x1="11" y1="8" x2="11" y2="14"/><line x1="8" y1="11" x2="14" y2="11"/>
                            </svg>
                        </button>
                        <span class="zoom-level" id="zoomLevel">100%</span>
                        <button class="btn btn-ghost btn-sm" id="btnZoomOut" title="Zoom Out">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
                                <line x1="8" y1="11" x2="14" y2="11"/>
                            </svg>
                        </button>
                        <button class="btn btn-ghost btn-sm" id="btnZoomReset" title="Reset Zoom">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
                                <path d="M3 3v5h5"/>
                            </svg>
                        </button>
                    </div>
                </div>
                <div class="toolbar-right">
                    <div class="toolbar-info">
                        <span class="info-item" id="infoSamples"></span>
                        <span class="info-item" id="infoDuration"></span>
                        <span class="info-item" id="infoSR"></span>
                    </div>
                    <button class="btn btn-ghost btn-sm" id="btnSettings" title="Settings">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="12" r="3"/>
                            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
                        </svg>
                    </button>
                    <button class="btn btn-ghost btn-sm" id="btnExport" title="Export Image">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                            <polyline points="7 10 12 15 17 10"/>
                            <line x1="12" y1="15" x2="12" y2="3"/>
                        </svg>
                    </button>
                </div>
            </div>

            <!-- Canvas Area -->
            <div class="canvas-area" id="canvasArea">
                <!-- Dynamic range slider -->
                <div class="range-control" id="rangeControl">
                    <label>Dynamic Range (dB)</label>
                    <div class="dual-range">
                        <input type="range" id="rangeMin" min="-140" max="0" value="-100" step="1">
                        <input type="range" id="rangeMax" min="-140" max="0" value="-20" step="1">
                    </div>
                    <div class="range-values">
                        <span id="rangeMinVal">-100 dB</span>
                        <span id="rangeMaxVal">-20 dB</span>
                    </div>
                </div>

                <!-- Main canvas + chirp panel -->
                <div class="canvas-with-panel">
                    <div class="canvas-wrapper" id="canvasWrapper">
                        <canvas id="mainCanvas"></canvas>
                        <canvas id="crosshairCanvas"></canvas>
                        <div class="canvas-overlay" id="canvasOverlay">
                            <div class="cursor-info" id="cursorInfo" style="display:none;">
                                <span id="cursorFreq"></span>
                                <span id="cursorTime"></span>
                                <span id="cursorPower"></span>
                                <span id="cursorDeltaFreq" style="display:none; color: var(--accent-secondary, #f43f5e);"></span>
                                <span id="cursorDeltaTime" style="display:none; color: var(--accent-secondary, #f43f5e);"></span>
                            </div>
                        </div>
                    </div>
                    <!-- Power sidebar (instantaneous spectrum at cursor) -->
                    <div class="power-sidebar" id="powerSidebar">
                        <canvas id="powerCanvas"></canvas>
                    </div>
                    <!-- Chirp Analysis Panel -->
                    <div class="chirp-panel" id="chirpPanel" style="display:none;">
                        <div class="chirp-panel-header">
                            <h3>Frame Structure</h3>
                            <div class="chirp-controls">
                                <label class="chirp-toggle">
                                    <input type="checkbox" id="chirpOverlay" checked>
                                    <span>Overlay</span>
                                </label>
                            </div>
                        </div>
                        <div class="chirp-config">
                            <div class="chirp-config-row">
                                <label>SF</label>
                                <select id="chirpSF">
                                    <option value="7" selected>SF7</option>
                                    <option value="8">SF8</option>
                                    <option value="9">SF9</option>
                                    <option value="10">SF10</option>
                                    <option value="11">SF11</option>
                                    <option value="12">SF12</option>
                                </select>
                            </div>
                            <div class="chirp-config-row">
                                <label>BW (kHz) <button class="btn btn-secondary btn-sm" id="btnAutoBW" style="padding: 0 4px; font-size: 10px; margin-left: 4px;">Auto</button></label>
                                <select id="chirpBW">
                                    <option value="125000" selected>125</option>
                                    <option value="250000">250</option>
                                    <option value="500000">500</option>
                                </select>
                            </div>
                            <div class="chirp-config-row">
                                <label>Threshold (dB)</label>
                                <input type="range" id="chirpThreshold" min="-120" max="-10" value="-60" step="1">
                                <span id="chirpThresholdVal">-60</span>
                            </div>
                            <button class="btn btn-primary btn-sm" id="btnDetectChirps">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
                                </svg>
                                Detect Chirps
                            </button>
                        </div>
                        <div class="chirp-results" id="chirpResults">
                            <div class="chirp-empty">Click "Detect Chirps" to analyze</div>
                        </div>
                        <div class="chirp-legend">
                            <div class="legend-item"><span class="legend-color preamble"></span>Preamble</div>
                            <div class="legend-item"><span class="legend-color sync"></span>Sync Word</div>
                            <div class="legend-item"><span class="legend-color header-data"></span>Header</div>
                            <div class="legend-item"><span class="legend-color payload"></span>Payload</div>
                        </div>
                    </div>
                </div>

                <!-- Spectrogram time navigation -->
                <div class="time-nav" id="timeNav">
                    <canvas id="overviewCanvas" height="40"></canvas>
                    <div class="time-nav-slider" id="timeNavSlider">
                        <div class="slider-handle left" id="sliderLeft"></div>
                        <div class="slider-window" id="sliderWindow"></div>
                        <div class="slider-handle right" id="sliderRight"></div>
                    </div>
                </div>
            </div>

            <!-- Loading overlay -->
            <div class="loading-overlay" id="loadingOverlay" style="display:none;">
                <div class="loading-spinner">
                    <div class="spinner"></div>
                    <p id="loadingText">Processing...</p>
                    <div class="progress-bar">
                        <div class="progress-fill" id="progressFill"></div>
                    </div>
                </div>
            </div>
            </div> <!-- End hidden UI -->
            </div>
            
            <!-- Drop Zone (Right side) -->
            <div class="drop-zone-container" id="dropZoneContainer" style="flex: 2; min-width: 300px; display: flex;">
                <div class="drop-zone" id="dropZone" style="border-radius: 0; border: none; border-left: 1px dashed var(--border-subtle); background: var(--bg-secondary); width: 100%;">
                    <div class="drop-zone-content">
                        <div class="drop-icon">
                            <svg width="64" height="64" viewBox="0 0 64 64" fill="none">
                                <rect x="8" y="12" width="48" height="40" rx="4" stroke="url(#dropGrad)" stroke-width="2" stroke-dasharray="6 4"/>
                                <path d="M32 24V44M24 36L32 44L40 36" stroke="url(#dropGrad)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                                <defs>
                                    <linearGradient id="dropGrad" x1="8" y1="12" x2="56" y2="52">
                                        <stop offset="0%" stop-color="#6366f1"/>
                                        <stop offset="100%" stop-color="#a78bfa"/>
                                    </linearGradient>
                                </defs>
                            </svg>
                        </div>
                        <h2>Drag & drop .cf32 file here</h2>
                        <p>or click to select file</p>
                        <div class="supported-formats">
                            <span class="format-tag">.cf32</span>
                            <span class="format-tag">Complex Float32</span>
                            <span class="format-tag">IQ Data</span>
                        </div>
                    </div>
                    <input type="file" id="fileInput" accept=".cf32" hidden>
                </div>
            </div>
        </div>
    </div>

    <script src="dsp.js?v=2"></script>
    <script src="colormaps.js?v=2"></script>
    <script src="app.js?v=3"></script>
</body>
</html>
